<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用語一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --main:#2e6ff2;
    --main-light:#eaf1ff;
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#222;
    --sub:#666;
    --border:#e2e5ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans JP",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--main);
    color:#fff;
    padding:14px 16px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header h1{
    margin:0 0 10px 0;
    font-size:18px;
  }
  nav{
    display:flex;
    gap:8px;
  }
  nav button{
    flex:1;
    padding:10px 8px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
  }
  nav button.active{
    background:#fff;
    color:var(--main);
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  /* ===== 用語一覧 ===== */
  #searchBox{
    width:100%;
    padding:10px 12px;
    font-size:15px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:12px;
    background:#fff;
  }
  details.cat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  details.cat summary{
    padding:12px 14px;
    font-weight:700;
    cursor:pointer;
    background:var(--main-light);
    color:var(--main);
    list-style:none;
  }
  details.cat summary::-webkit-details-marker{display:none;}
  .group-name{
    font-size:13px;
    color:var(--sub);
    font-weight:700;
    padding:10px 14px 2px;
  }
  .term-item{
    padding:10px 14px;
    border-top:1px solid var(--border);
  }
  .term-item .t{
    font-weight:700;
    color:var(--text);
  }
  .term-item .a{
    color:var(--sub);
    font-size:14px;
    margin-top:2px;
  }
  .term-item.hidden{display:none;}
  details.cat.hidden{display:none;}

  /* ===== 一問一答 ===== */
  .quiz-controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .quiz-controls select{
    flex:1;
    min-width:150px;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
  }
  .quiz-controls label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    background:#fff;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }
  .quiz-controls button{
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:var(--main);
    color:#fff;
    font-weight:700;
    cursor:pointer;
  }
  .progress{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    margin-bottom:8px;
  }
  .score{
    text-align:center;
    font-size:13px;
    color:var(--sub);
    margin-bottom:10px;
  }
  .score span{font-weight:700;}
  .score .ok{color:#2a9d4a;}
  .score .ng{color:#e4543f;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:16px;
  }
  .cat-tag{
    font-size:12px;
    color:var(--main);
    background:var(--main-light);
    padding:4px 10px;
    border-radius:20px;
    font-weight:700;
  }
  .question{
    font-size:24px;
    font-weight:700;
    line-height:1.5;
  }
  
  /* ===== 手書きキャンバス ===== */
  .canvas-wrapper{
    width:100%;
    position:relative;
    margin-bottom:16px;
  }
  #drawCanvas{
    display:block;
    width:100%;
    border:2px solid var(--border);
    border-radius:10px;
    background:#fff;
    cursor:crosshair;
    touch-action:none;
  }
  .canvas-controls{
    display:flex;
    gap:8px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .canvas-controls button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#eee;
    color:#333;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
  }
  .canvas-controls button:hover{
    background:#ddd;
  }
  .canvas-controls input[type="color"]{
    width:40px;
    height:32px;
    border:1px solid var(--border);
    border-radius:6px;
    cursor:pointer;
  }
  .canvas-controls input[type="range"]{
    flex:1;
    min-width:100px;
    min-height:32px;
  }

  .answer-box{
    display:none;
    width:100%;
    border-top:2px dashed var(--border);
    padding-top:16px;
    text-align:left;
  }
  .answer-box.show{display:block;}
  .answer-text{
    font-family:"Yomogi",sans-serif;
    font-size:20px;
    color:#1e4fc0;
    line-height:1.8;
    transform:rotate(-0.6deg);
    animation:fadeIn .4s ease;
    padding:12px;
    background:var(--main-light);
    border-radius:8px;
    border-left:4px solid var(--main);
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px) rotate(-0.6deg);}
    to{opacity:1; transform:translateY(0) rotate(-0.6deg);}
  }
  .btn-row{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
  }
  .btn-row button{
    padding:12px 20px;
    border-radius:10px;
    border:none;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    flex:1;
    min-width:120px;
  }
  .btn-show{background:var(--main); color:#fff;}
  .btn-next{background:#333; color:#fff;}
  .btn-ok{background:#2a9d4a; color:#fff;}
  .btn-ng{background:#e4543f; color:#fff;}
  .btn-restart{background:#999; color:#fff; font-size:13px; padding:8px 14px; flex:0.5;}
  .finish{
    text-align:center;
    padding:30px 10px;
  }
  .finish p{font-size:18px; font-weight:700;}
</style>
</head>
<body>

<header>
  <h1>📘 用語一問一答（手書き版）</h1>
  <nav>
    <button id="tabList" class="active">用語一覧</button>
    <button id="tabQuiz">一問一答</button>
  </nav>
</header>

<main>
  <!-- 用語一覧パネル -->
  <section id="panelList" class="panel active">
    <input type="text" id="searchBox" placeholder="用語・説明で検索（例：パケット）">
    <div id="listArea"></div>
  </section>

  <!-- 一問一答パネル -->
  <section id="panelQuiz" class="panel">
    <div class="quiz-controls">
      <select id="catSelect"></select>
      <label><input type="checkbox" id="shuffleCheck" checked> シャッフル</label>
      <button id="startBtn">開始</button>
    </div>
    <div id="quizArea"></div>
  </section>
</main>

/* ========= 用語一覧 描画 ========= */
const listArea = document.getElementById('listArea');

    det.open = false;
    const sum = document.createElement('summary');
    const count = catObj.groups.reduce((n,g)=>n+g.items.length,0);
    sum.textContent = catObj.cat + '（' + count + '）';
    det.appendChild(sum);

    catObj.groups.forEach(g=>{
      if(g.name){
        const gn = document.createElement('div');
        gn.className = 'group-name';
        gn.textContent = '▸ ' + g.name;
        det.appendChild(gn);
      }
      g.items.forEach(([t,a])=>{
        const div = document.createElement('div');
        div.className = 'term-item';
        div.dataset.term = t.toLowerCase();
        div.dataset.ans = a.toLowerCase();
        div.innerHTML = '<div class="t">'+t+'</div><div class="a">'+a+'</div>';
        det.appendChild(div);
      });
    });
    listArea.appendChild(det);
  });
}
renderList();

document.getElementById('searchBox').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#listArea .cat').forEach(det=>{
    let any = false;
    det.querySelectorAll('.term-item').forEach(item=>{
      const match = !q || item.dataset.term.includes(q) || item.dataset.ans.includes(q);
      item.classList.toggle('hidden', !match);
      if(match) any = true;
    });
    det.classList.toggle('hidden', !any);
    if(q) det.open = any;
  });
});

/* ========= 一問一答 ========= */
const catSelect = document.getElementById('catSelect');
const quizArea = document.getElementById('quizArea');
let pool = [];
let qIndex = 0;
let score = {ok:0, ng:0};
let canvas, ctx;

function buildCatOptions(){
  catSelect.innerHTML = '<option value="all">すべて（' + DATA.reduce((n,c)=>n+c.groups.reduce((m,g)=>m+g.items.length,0),0) + '問）</option>';
  DATA.forEach((c,i)=>{
    const n = c.groups.reduce((m,g)=>m+g.items.length,0);
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = c.cat + '（' + n + '問）';
    catSelect.appendChild(opt);
  });
}
buildCatOptions();

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  const val = catSelect.value;
  let items = [];
  if(val === 'all'){
    DATA.forEach(c=> c.groups.forEach(g=> g.items.forEach(([t,a])=> items.push({cat:c.cat, t, a}))));
  }else{
    const c = DATA[Number(val)];
    c.groups.forEach(g=> g.items.forEach(([t,a])=> items.push({cat:c.cat, t, a})));
  }
  if(document.getElementById('shuffleCheck').checked) shuffleArr(items);
  pool = items;
  qIndex = 0;
  score = {ok:0, ng:0};
  renderQuiz();
});

function initCanvas(){
  canvas = document.getElementById('drawCanvas');
  if(!canvas) return;
  ctx = canvas.getContext('2d');
  
  // Canvasをウィンドウサイズに合わせる
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = 250 * window.devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '250px';
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  
  let isDrawing = false;
  
  canvas.addEventListener('mousedown', (e)=>{ isDrawing = true; draw(e); });
  canvas.addEventListener('mousemove', (e)=>{ if(isDrawing) draw(e); });
  canvas.addEventListener('mouseup', ()=>{ isDrawing = false; });
  canvas.addEventListener('mouseout', ()=>{ isDrawing = false; });
  
  // タッチ対応
  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); isDrawing = true; drawTouch(e); });
  canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); if(isDrawing) drawTouch(e); });
  canvas.addEventListener('touchend', ()=>{ isDrawing = false; });
  
  function draw(e){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width) / window.devicePixelRatio;
    const y = (e.clientY - rect.top) * (canvas.height / rect.height) / window.devicePixelRatio;
    
    if(e.type === 'mousedown'){
      ctx.beginPath();
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }
  
  function drawTouch(e){
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width) / window.devicePixelRatio;
    const y = (touch.clientY - rect.top) * (canvas.height / rect.height) / window.devicePixelRatio;
    
    if(e.type === 'touchstart'){
      ctx.beginPath();
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }
}

function renderQuiz(){
  if(pool.length === 0){
    quizArea.innerHTML = '<p style="text-align:center;color:#888;">上のメニューから範囲を選んで「開始」を押してください。</p>';
    return;
  }
  if(qIndex >= pool.length){
    quizArea.innerHTML =
      '<div class="finish">'+
        '<p>🎉 全' + pool.length + '問 終了！</p>'+
        '<div class="score">正解 <span class="ok">' + score.ok + '</span>　/　不正解 <span class="ng">' + score.ng + '</span></div>'+
        '<button class="btn-restart" id="restartBtn">もう一度最初から</button>'+
      '</div>';
    document.getElementById('restartBtn').addEventListener('click', ()=>{
      qIndex = 0; score = {ok:0, ng:0};
      if(document.getElementById('shuffleCheck').checked) shuffleArr(pool);
      renderQuiz();
    });
    return;
  }

  const q = pool[qIndex];
  quizArea.innerHTML =
    '<div class="progress">' + (qIndex+1) + ' / ' + pool.length + '問</div>' +
    '<div class="score">正解 <span class="ok">'+score.ok+'</span>　不正解 <span class="ng">'+score.ng+'</span></div>' +
    '<div class="card">' +
      '<div class="cat-tag">' + q.cat + '</div>' +
      '<div class="question">' + q.t + '</div>' +
      '<div class="canvas-wrapper">' +
        '<canvas id="drawCanvas"></canvas>' +
        '<div class="canvas-controls">' +
          '<button id="clearBtn">消す</button>' +
          '<label style="display:flex; align-items:center; gap:6px; flex:1;">' +
            '太さ <input type="range" id="sizeSlider" min="1" max="10" value="2" style="flex:1;">' +
          '</label>' +
          '<input type="color" id="colorPicker" value="#000000">' +
        '</div>' +
      '</div>' +
      '<div class="answer-box" id="answerBox">' +
        '<div class="answer-text">' + q.a + '</div>' +
      '</div>' +
      '<div class="btn-row" id="btnRow">' +
        '<button class="btn-show" id="showBtn">答えを見る</button>' +
      '</div>' +
    '</div>';

  initCanvas();
  
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
  
  document.getElementById('sizeSlider').addEventListener('change', (e)=>{
    ctx.lineWidth = e.target.value;
  });
  
  document.getElementById('colorPicker').addEventListener('change', (e)=>{
    ctx.strokeStyle = e.target.value;
  });

  document.getElementById('showBtn').addEventListener('click', ()=>{
    document.getElementById('answerBox').classList.add('show');
    document.getElementById('btnRow').innerHTML =
      '<button class="btn-ok" id="okBtn">〇 わかった</button>' +
      '<button class="btn-ng" id="ngBtn">✕ わからなかった</button>';
    document.getElementById('okBtn').addEventListener('click', ()=>{ score.ok++; next(); });
    document.getElementById('ngBtn').addEventListener('click', ()=>{ score.ng++; next(); });
  });
}

function next(){
  qIndex++;
  renderQuiz();
}

/* ========= タブ切り替え ========= */
const tabList = document.getElementById('tabList');
const tabQuiz = document.getElementById('tabQuiz');
const panelList = document.getElementById('panelList');
const panelQuiz = document.getElementById('panelQuiz');

tabList.addEventListener('click', ()=>{
  tabList.classList.add('active'); tabQuiz.classList.remove('active');
  panelList.classList.add('active'); panelQuiz.classList.remove('active');
});
tabQuiz.addEventListener('click', ()=>{
  tabQuiz.classList.add('active'); tabList.classList.remove('active');
  panelQuiz.classList.add('active'); panelList.classList.remove('active');
  if(pool.length===0) renderQuiz();
});
</script>
